<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketIntel — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#f2f0eb;font-family:'Inter',sans-serif;min-height:100vh}
.topbar{background:#111;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px}
.logo{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;letter-spacing:-0.5px}
.logo span{color:#22c77a}
.admin-badge{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;background:rgba(240,168,50,0.15);color:#f0a832;padding:3px 10px;border-radius:6px}
.btn-sm{padding:6px 14px;border-radius:7px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#6a6a68;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s}
.btn-sm:hover{color:#f2f0eb}
.content{max-width:900px;margin:0 auto;padding:32px 24px}
h1{font-size:20px;font-weight:600;margin-bottom:6px}
.subtitle{font-size:13px;color:#5a5a58;margin-bottom:28px}
.section{margin-bottom:36px}
.section-title{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#5a5a58;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.07)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.stat{background:#141414;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:14px 16px}
.stat-label{font-size:11px;color:#5a5a58;margin-bottom:4px;font-family:'JetBrains Mono',monospace;letter-spacing:0.05em}
.stat-val{font-size:22px;font-weight:600;font-family:'JetBrains Mono',monospace}
.val-pending{color:#f0a832}
.val-approved{color:#22c77a}
.val-rejected{color:#f04444}
.val-total{color:#f2f0eb}
.user-card{background:#141414;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.user-card:hover{border-color:rgba(255,255,255,0.12)}
.user-info{flex:1;min-width:0}
.user-name{font-size:14px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-email{font-size:12px;color:#5a5a58;font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-time{font-size:11px;color:#3a3a38;margin-top:3px;font-family:'JetBrains Mono',monospace}
.user-actions{display:flex;gap:6px;flex-shrink:0}
.btn-approve{padding:6px 14px;border-radius:7px;border:1px solid rgba(34,199,122,0.3);background:rgba(34,199,122,0.1);color:#22c77a;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s}
.btn-approve:hover{background:rgba(34,199,122,0.2)}
.btn-reject{padding:6px 14px;border-radius:7px;border:1px solid rgba(240,68,68,0.3);background:rgba(240,68,68,0.1);color:#f04444;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s}
.btn-reject:hover{background:rgba(240,68,68,0.2)}
.status-pill{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:3px 9px;border-radius:6px}
.sp-approved{background:rgba(34,199,122,0.12);color:#22c77a}
.sp-rejected{background:rgba(240,68,68,0.12);color:#f04444}
.sp-pending{background:rgba(240,168,50,0.12);color:#f0a832}
.sp-admin{background:rgba(68,136,240,0.12);color:#4488f0}
.empty{font-size:13px;color:#3a3a38;padding:20px 0;text-align:center;font-style:italic}
.toast-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid rgba(34,199,122,0.3);color:#22c77a;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;display:none;z-index:100}
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <div class="logo">Market<span>Intel</span></div>
    <span class="admin-badge">Admin</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="btn-sm" onclick="window.location.href='/index.html'">← Dashboard</button>
    <button class="btn-sm" onclick="signOut()">Sign out</button>
  </div>
</div>

<div class="content">
  <h1>User Management</h1>
  <div class="subtitle">Approve or reject access requests. Approved users can view the dashboard.</div>

  <div class="stats">
    <div class="stat"><div class="stat-label">PENDING</div><div class="stat-val val-pending" id="cPending">–</div></div>
    <div class="stat"><div class="stat-label">APPROVED</div><div class="stat-val val-approved" id="cApproved">–</div></div>
    <div class="stat"><div class="stat-label">REJECTED</div><div class="stat-val val-rejected" id="cRejected">–</div></div>
    <div class="stat"><div class="stat-label">TOTAL</div><div class="stat-val val-total" id="cTotal">–</div></div>
  </div>

  <div class="section">
    <div class="section-title">Pending Approval</div>
    <div id="pendingList"><div class="empty">Loading...</div></div>
  </div>

  <div class="section">
    <div class="section-title">Approved Users</div>
    <div id="approvedList"><div class="empty">Loading...</div></div>
  </div>

  <div class="section">
    <div class="section-title">Rejected</div>
    <div id="rejectedList"><div class="empty">Loading...</div></div>
  </div>
</div>

<div class="toast-bar" id="toast"></div>

<script type="module">
import { supabase, requireAdmin } from './lib/supabase.js'

const adminProfile = await requireAdmin()
if (!adminProfile) { /* redirected */ }

async function loadUsers() {
  const { data: users, error } = await supabase
    .from('profiles')
    .select('*')
    .order('created_at', { ascending: false })

  if (error || !users) return

  const pending = users.filter(u => u.status === 'pending' && !u.is_admin)
  const approved = users.filter(u => u.status === 'approved' || u.is_admin)
  const rejected = users.filter(u => u.status === 'rejected')

  document.getElementById('cPending').textContent = pending.length
  document.getElementById('cApproved').textContent = approved.length
  document.getElementById('cRejected').textContent = rejected.length
  document.getElementById('cTotal').textContent = users.length

  renderList('pendingList', pending, true)
  renderList('approvedList', approved, false)
  renderList('rejectedList', rejected, false)
}

function renderList(containerId, users, showActions) {
  const el = document.getElementById(containerId)
  if (!users.length) { el.innerHTML = '<div class="empty">None</div>'; return }
  el.innerHTML = users.map(u => {
    const date = new Date(u.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })
    const statusPill = u.is_admin
      ? `<span class="status-pill sp-admin">Admin</span>`
      : `<span class="status-pill sp-${u.status}">${u.status}</span>`
    const actions = showActions ? `
      <button class="btn-approve" onclick="approve('${u.id}', '${u.email}')">Approve</button>
      <button class="btn-reject" onclick="reject('${u.id}')">Reject</button>` : statusPill
    return `<div class="user-card">
      <div class="user-info">
        <div class="user-name">${u.full_name || 'No name provided'}</div>
        <div class="user-email">${u.email}</div>
        <div class="user-time">Signed up ${date}</div>
      </div>
      <div class="user-actions">${actions}</div>
    </div>`
  }).join('')
}

window.approve = async (id, email) => {
  const { error } = await supabase.from('profiles')
    .update({ status: 'approved', approved_at: new Date().toISOString(), approved_by: adminProfile.id })
    .eq('id', id)
  if (!error) { showToast(`✓ Approved ${email}`); loadUsers() }
}

window.reject = async (id) => {
  const { error } = await supabase.from('profiles').update({ status: 'rejected' }).eq('id', id)
  if (!error) { showToast('User rejected'); loadUsers() }
}

window.signOut = async () => { await supabase.auth.signOut(); window.location.href = '/login.html' }

function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.style.display = 'block'
  setTimeout(() => t.style.display = 'none', 3000)
}

loadUsers()
setInterval(loadUsers, 30000)
</script>
</body>
</html>
