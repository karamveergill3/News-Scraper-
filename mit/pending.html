<style>
*{box-sizing:border-box;margin:0;padding:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin-slow{to{transform:rotate(360deg)}}
@keyframes pulse-border{0%,100%{border-color:rgba(240,168,50,0.15)}50%{border-color:rgba(240,168,50,0.4)}}
body{background:#050505;color:#f2f0eb;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:440px;text-align:center;animation:fadeUp 0.6s ease}
.logo{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:rgba(34,199,122,0.5);margin-bottom:40px}
.icon-wrap{width:80px;height:80px;margin:0 auto 24px;border-radius:50%;background:rgba(240,168,50,0.08);border:1px solid rgba(240,168,50,0.2);display:flex;align-items:center;justify-content:center;font-size:34px;animation:pulse-border 3s ease infinite;position:relative}
.icon-ring{position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(240,168,50,0.15);animation:spin-slow 20s linear infinite}
h2{font-size:22px;font-weight:600;letter-spacing:-0.5px;margin-bottom:10px}
.desc{font-size:14px;color:#5a5a58;line-height:1.65;margin-bottom:24px;max-width:340px;margin-left:auto;margin-right:auto}
.email-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:13px 18px;font-size:14px;color:#9a9890;font-family:'JetBrains Mono',monospace;margin-bottom:28px}
.status-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px;padding:10px 16px;background:rgba(240,168,50,0.06);border:1px solid rgba(240,168,50,0.12);border-radius:10px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#f0a832;animation:pulse-border 1.5s ease infinite}
.status-text{font-size:12px;color:#f0a832;font-family:'JetBrains Mono',monospace;letter-spacing:0.05em}
.time-note{font-size:12px;color:#2a2a2a;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:#5a5a58;font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.25s ease;backdrop-filter:blur(4px)}
.btn:hover{color:#f2f0eb;border-color:rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);transform:translateY(-1px)}
</style>
</head>
<body>

async function init(){

    document.getElementById('userEmail').textContent=user.email
    const{data:p,error}=await sb.from('profiles').select('status,is_admin').eq('id',user.id).single()

}

async function doSignOut(){
  await sb.auth.signOut()
  window.location.replace('/login.html')
}

init()
